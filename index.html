<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Roulette Strategy Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#ddd;font-family:system-ui,sans-serif;padding:16px;max-width:820px;margin:0 auto;font-size:13px}
h1{text-align:center;font-size:18px;color:#999;margin-bottom:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
label{color:#888;font-size:12px}
select,button{padding:7px 12px;border-radius:6px;border:1px solid #333;background:#1e1e1e;color:#ddd;font-size:12px;cursor:pointer}
select:focus,button:focus{outline:none;border-color:#555}
#btnStart{background:#2e7d46;border-color:#2e7d46;color:#fff;font-weight:700}
#btnStart:disabled{opacity:.4;cursor:default}
#btnStop{background:#7d2e2e;border-color:#7d2e2e;color:#fff}
#btnStop:disabled{opacity:.4;cursor:default}
.spin-area{text-align:center;margin:12px 0 8px}
.spin-circle{width:72px;height:72px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:3px solid #444;transition:background .15s}
.spin-circle.red{background:#c0392b;border-color:#e74c3c}
.spin-circle.black{background:#2c2c2c;border-color:#666}
.spin-circle.green{background:#1e7d3e;border-color:#27ae60}
.spin-circle.empty{background:#1a1a1a;border-color:#2a2a2a;color:#444}
.spin-counter{font-size:11px;color:#666;margin-top:5px}
.history{display:flex;gap:4px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%}
.dot.red{background:#c0392b}
.dot.black{background:#444;border:1px solid #666}
.dot.green{background:#1e7d3e}
.dot.empty{background:#1e1e1e;border:1px solid #2a2a2a}
.pats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pat{background:#161616;border:1px solid #2a2a2a;border-radius:6px;padding:5px 10px;min-width:90px;text-align:center}
.pat.on{border-color:#2e7d46;background:rgba(46,125,70,.12)}
.pat-name{font-weight:600;font-size:11px;color:#aaa}
.pat-prog{font-size:11px;color:#666;margin-top:2px}
.pat.on .pat-prog{color:#4caf50}
table{width:100%;border-collapse:collapse;margin:12px 0}
th{background:#181818;color:#777;padding:7px 10px;text-align:left;border-bottom:1px solid #2a2a2a;font-weight:600;font-size:11px;text-transform:uppercase}
td{padding:7px 10px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
tr.busted td{opacity:.35}
.g{color:#4caf50}
.r{color:#e74c3c}
.z{color:#666}
.sep{width:100%;border:none;border-top:1px solid #222;margin:12px 0}
.result{background:#161616;border:1px solid #2a2a2a;border-radius:10px;padding:18px;text-align:center;margin:12px 0;display:none}
.result.show{display:block}
.result-title{font-size:17px;margin-bottom:12px;color:#ccc}
.result-grid{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.result-box{min-width:120px}
.result-sys{font-size:11px;color:#666;margin-bottom:4px}
.result-pnl{font-size:20px;font-weight:700}
.result-detail{font-size:11px;color:#666;margin-top:3px}
.multi-result{margin-top:16px;background:#111;border:1px solid #1e1e1e;border-radius:8px;overflow:hidden;display:none}
.multi-result.show{display:block}
.multi-result table th,.multi-result table td{font-size:11px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700}
.badge-gold{background:rgba(255,200,0,.15);color:#ffd700}
.badge-bust{background:rgba(255,0,0,.12);color:#e74c3c}
.note{font-size:11px;color:#555;text-align:center;margin:6px 0}
</style>
</head>
<body>
<h1>🎰 Roulette Strategy Simulator</h1>

<div class="controls">
  <label>Budget:
    <select id="selBudget">
      <option value="20">20 CHF</option>
      <option value="100" selected>100 CHF</option>
      <option value="500">500 CHF</option>
      <option value="1000">1000 CHF</option>
      <option value="2000">2000 CHF</option>
      <option value="5000">5000 CHF</option>
      <option value="10000">10 000 CHF (Tischlimit)</option>
      <option value="1e9">∞ Unbegrenzt</option>
    </select>
  </label>
  <label>Spins:
    <select id="selSpins">
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="200">200</option>
      <option value="500" selected>500</option>
      <option value="1000">1000</option>
    </select>
  </label>
  <label>Basiseinsatz:
    <select id="selBase">
      <option value="0.1">0.10 CHF</option>
      <option value="0.5">0.50 CHF</option>
      <option value="1" selected>1.00 CHF</option>
      <option value="5">5.00 CHF</option>
    </select>
  </label>
  <label>Geschwindigkeit:
    <select id="selSpeed">
      <option value="500">Normal (2/s)</option>
      <option value="100" selected>Schnell (10/s)</option>
      <option value="20">Sehr schnell (50/s)</option>
      <option value="0">Sofort</option>
    </select>
  </label>
  <button id="btnStart">▶ Start</button>
  <button id="btnStop" disabled>⏹ Stop</button>
  <button id="btnReset">↺ Reset</button>
  <button id="btnMulti" title="100 Läufe sofort, zeigt Durchschnitt">📊 100× Batch</button>
</div>

<div class="spin-area">
  <div class="spin-circle empty" id="spinCircle">?</div>
  <div class="spin-counter" id="spinCounter">0 / –</div>
</div>

<div class="history" id="history"></div>

<div class="pats">
  <div class="pat" id="pat-streak"><div class="pat-name">Serie</div><div class="pat-prog" id="pp-streak">0/3</div></div>
  <div class="pat" id="pat-alt"><div class="pat-name">Wechsel</div><div class="pat-prog" id="pp-alt">0/4</div></div>
  <div class="pat" id="pat-dd"><div class="pat-name">Doppel-Doppel</div><div class="pat-prog" id="pp-dd">0/3</div></div>
  <div class="pat" id="pat-block"><div class="pat-name">Doppel-Einzeln</div><div class="pat-prog" id="pp-block">0/5</div></div>
</div>

<table id="mainTable">
  <thead>
    <tr>
      <th>Strategie</th>
      <th>Budget</th>
      <th>P&amp;L</th>
      <th>W / L</th>
      <th>Recovery</th>
      <th>Nächste Wette</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="result" id="result">
  <div class="result-title" id="rTitle"></div>
  <div class="result-grid" id="rGrid"></div>
  <p class="note" id="rNote"></p>
</div>

<div class="multi-result" id="multiResult">
  <table>
    <thead>
      <tr>
        <th>Strategie</th>
        <th>Ø P&amp;L</th>
        <th>Ø Wetten</th>
        <th>Ø Win-Rate</th>
        <th>Bust-Rate</th>
        <th>Bestes Ergebnis</th>
        <th>Schlechtestes</th>
      </tr>
    </thead>
    <tbody id="multiTbody"></tbody>
  </table>
</div>

<!-- Alle Logik in simulator.js (Chrome MV3 CSP erlaubt kein inline-Script) -->
<script src="simulator.js"></script>
</body>
</html>
